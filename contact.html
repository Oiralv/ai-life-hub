<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Contact AI Life Hub Tech - Get in touch with us for inquiries, collaborations, or feedback." />
  <title>Contact - AI Life Hub Tech</title>
  <style>
    body {font-family: 'Segoe UI', Arial; margin: 0; background: #f8f8f8; color: #333;}
    .container {max-width: 900px; margin: 30px auto; background: #fff; padding: 30px; border-radius: 6px; box-shadow: 0 0 10px rgba(0,0,0,0.1);}
    h1 {color: #0a2540;}
    form {display: flex; flex-direction: column;}
    input, textarea {margin: 10px 0; padding: 10px; border: 1px solid #ccc; border-radius: 5px;}
    button {background: #0a2540; color: white; padding: 10px; border: none; border-radius: 5px; cursor: pointer;}
    button:hover {background: #133b6b;}
  </style>
</head>
<body>
  <div class="container">
    <h1>Contact Us</h1>
    <p>If you have any questions, suggestions, or collaboration ideas, feel free to reach out. We'll do our best to respond within 2–3 business days.</p>

    <form action="mailto:info@ailifehubtech.com" method="post" enctype="text/plain">
      <label for="name">Name:</label>
      <input type="text" id="name" name="name" required />

      <label for="email">Email:</label>
      <input type="email" id="email" name="email" required />

      <label for="message">Message:</label>
      <textarea id="message" name="message" rows="6" required></textarea>

      <button type="submit">Send Message</button>
    </form>

    <p>Or write directly to: <strong>info@ailifehubtech.com</strong></p>
  </div>
</body>
</html>
