name: Weekly Auto-generate AI Article

on:
  schedule:
    - cron: "0 12 * * 1"   # ⏰ Cada lunes a las 12:00 UTC (puedes cambiarlo)
  workflow_dispatch:       # Permite ejecutarlo manualmente desde GitHub Actions

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: 🐍 Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.10"

      - name: 📦 Install dependencies
        run: pip install --upgrade openai


      - name: ✍️ Generate weekly article
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: gpt-5
        run: |
          python scripts/generate_post.py

      - name: 💾 Commit and push new articles
        run: |
          git config user.name "AI Life Hub Bot"
          git config user.email "bot@ailifehubtech.com"
          git add posts/*.md posts.json || echo "No posts to add"
          git commit -m "🤖 Weekly AI article update" || echo "Nothing to commit"
          git push

