<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI Life Hub Tech - Article</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Inter', 'Segoe UI', Arial, sans-serif;
      margin: 0;
      background: #f4f6f9;
      color: #333;
      line-height: 1.8;
    }
    header {
      background: #0a2540;
      color: #fff;
      padding: 30px 0;
      text-align: center;
    }
    header h1 {
      margin: 0;
      font-size: 2.2em;
    }
    .container {
      width: 90%;
      max-width: 850px;
      background: white;
      margin: 40px auto;
      padding: 40px;
      border-radius: 16px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.1);
    }
    #article-content h1, #article-content h2, #article-content h3 {
      color: #0a2540;
      margin-top: 1.4em;
    }
    #article-content p {
      margin-bottom: 1em;
      font-size: 1.05em;
    }
    #article-content ul {
      padding-left: 1.4em;
      margin-bottom: 1em;
    }
    #article-content li {
      margin-bottom: 0.5em;
    }
    #article-content img {
      display: block;
      max-width: 100%;
      margin: 20px auto;
      border-radius: 10px;
    }
    .back-link {
      display: inline-block;
      margin-top: 20px;
      padding: 10px 18px;
      background: #0a2540;
      color: white;
      border-radius: 8px;
      text-decoration: none;
      font-weight: bold;
      transition: 0.3s ease;
    }
    .back-link:hover {
      background: #133b6b;
    }
  </style>
</head>
<body>
  <header>
    <h1>AI Life Hub Tech</h1>
    <p>Exploring the Future of Artificial Intelligence</p>
  </header>

  <div class="container">
    <div id="article-content">Loading article...</div>
    <a href="index.html" class="back-link">← Back to Home</a>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <script>
    async function loadArticle() {
      const params = new URLSearchParams(window.location.search);
      const file = params.get("file");
      const container = document.getElementById("article-content");

      if (!file) {
        container.innerHTML = "<p>❌ No article selected.</p>";
        return;
      }

      try {
        const response = await fetch(`posts/${file}`);
        const text = await response.text();
        const html = marked.parse(text);
        container.innerHTML = html;
      } catch (error) {
        container.innerHTML = "<p>⚠️ Unable to load this article.</p>";
        console.error(error);
      }
    }

    loadArticle();
  </script>
</body>
</html>
