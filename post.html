<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Read the latest AI and technology insights from AI Life Hub Tech." />
  <title>AI Life Hub Tech - Article</title>
  <style>
    body {
      font-family: 'Segoe UI', Arial, sans-serif;
      margin: 0;
      background: #f4f4f4;
      color: #333;
      line-height: 1.6;
    }
    header {
      background: #0a2540;
      color: #fff;
      text-align: center;
      padding: 20px 0;
    }
    header h2 {
      margin: 0;
      font-size: 1.8em;
    }
    nav {
      background: #133b6b;
      text-align: center;
      padding: 10px;
    }
    nav a {
      color: #fff;
      text-decoration: none;
      margin: 0 15px;
      font-weight: bold;
    }
    nav a:hover {
      text-decoration: underline;
    }
    .container {
      width: 90%;
      max-width: 900px;
      margin: 30px auto;
      background: white;
      padding: 30px;
      border-radius: 8px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
    }
    article h1, article h2, article h3 {
      color: #0a2540;
    }
    article img {
      max-width: 100%;
      border-radius: 8px;
      margin: 15px 0;
    }
    .related {
      margin-top: 40px;
      border-top: 2px solid #eee;
      padding-top: 20px;
    }
    .related h3 {
      color: #0a2540;
      margin-bottom: 10px;
    }
    .related ul {
      list-style: none;
      padding: 0;
    }
    .related ul li {
      margin: 10px 0;
    }
    .related ul li a {
      text-decoration: none;
      color: #133b6b;
      font-weight: bold;
    }
    .related ul li a:hover {
      text-decoration: underline;
    }
    footer {
      text-align: center;
      padding: 20px;
      background: #0a2540;
      color: #fff;
      font-size: 0.9em;
      margin-top: 50px;
    }
  </style>
  <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-2590388099431427"
     crossorigin="anonymous"></script>
</head>

<body>
  <header>
    <h2>AI Life Hub Tech</h2>
    <p>Exploring the Future of Artificial Intelligence and Technology</p>
  </header>

  <nav>
    <a href="index.html">Home</a>
    <a href="about.html">About</a>
    <a href="contact.html">Contact</a>
    <a href="privacy-policy.html">Privacy Policy</a>
    <a href="terms.html">Terms & Conditions</a>
  </nav>

  <div class="container">
    <article id="article-content">
      <p>Loading article...</p>
    </article>
  </div>

  <footer>
    <p>&copy; 2025 AI Life Hub Tech. All rights reserved.</p>
  </footer>

  <!-- Markdown + Related Articles loader -->
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <script>
    const params = new URLSearchParams(window.location.search);
    const file = params.get("file");

    async function loadArticle() {
      const container = document.getElementById("article-content");

      if (!file) {
        container.innerHTML = "<p>❌ No article selected.</p>";
        return;
      }

      try {
        // Cargar el artículo Markdown
        const response = await fetch(`posts/${file}`);
        const markdown = await response.text();
        const html = marked.parse(markdown);
        container.innerHTML = html;

        // Cargar artículos relacionados
        const res = await fetch("posts.json");
        if (!res.ok) throw new Error("Cannot load posts.json");
        const posts = await res.json();

        const related = posts
          .filter(p => p.file !== file)
          .sort(() => 0.5 - Math.random())
          .slice(0, 3);

        if (related.length > 0) {
          const relatedHTML = `
            <div class="related">
              <h3>Related Articles</h3>
              <ul>
                ${related.map(r => `
                  <li><a href="post.html?file=${r.file}">${r.title}</a></li>
                `).join("")}
              </ul>
            </div>
          `;
          container.innerHTML += relatedHTML;
        }
      } catch (error) {
        console.error("Error loading article:", error);
        container.innerHTML = "<p>⚠️ Error loading article.</p>";
      }
    }

    loadArticle();
  </script>
</body>
</html>
