<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Read the latest AI and technology insights from AI Life Hub Tech." />
  <title>AI Life Hub Tech - Article</title>
  <style>
    body {
      font-family: 'Segoe UI', Arial, sans-serif;
      margin: 0;
      background: #f4f4f4;
      color: #333;
      line-height: 1.6;
    }
    header {
      background: #0a2540;
      color: #fff;
      text-align: center;
      padding: 20px 0;
    }
    header h2 {
      margin: 0;
      font-size: 1.8em;
    }
    nav {
      background: #133b6b;
      text-align: center;
      padding: 10px;
    }
    nav a {
      color: #fff;
      text-decoration: none;
      margin: 0 15px;
      font-weight: bold;
    }
    nav a:hover {
      text-decoration: underline;
    }
    .container {
      width: 90%;
      max-width: 900px;
      margin: 30px auto;
      background: white;
      padding: 30px;
      border-radius: 8px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
    }
    article h1, article h2, article h3 {
      color: #0a2540;
    }
    article img {
      max-width: 100%;
      border-radius: 8px;
      margin: 15px 0;
    }
    .related {
      margin-top: 40px;
      border-top: 2px solid #eee;
      padding-top: 20px;
    }
    .related h3 {
      color: #0a2540;
      margin-bottom: 10px;
    }
    .related ul {
      list-style: none;
      padding: 0;
    }
    .related ul li {
      margin: 10px 0;
    }
    .related ul li a {
      text-decoration: none;
      color: #133b6b;
      font-weight: bold;
    }
    .related ul li a:hover {
      text-decoration: underline;
    }
    footer {
      text-align: center;
      padding: 20px;
      background: #0a2540;
      color: #fff;
      font-size: 0.9em;
      margin-top: 50px;
    }
  </style>
  <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-2590388099431427"
     crossorigin="anonymous"></script>
</head>

<body>
  <header>
    <h2>AI Life Hub Tech</h2>
    <p>Exploring the Future of Artificial Intelligence and Technology</p>
  </header>

  <nav>
    <a href="index.html">Home</a>
    <a href="about.html">About</a>
    <a href="contact.html">Contact</a>
    <a href="privacy-policy.html">Privacy Policy</a>
    <a href="terms.html">Terms & Conditions</a>
  </nav>

  <div class="container">
    <article id="article-content">
      <p>Loading article...</p>
    </article>
  </div>

  <footer>
    <p>&copy; 2025 AI Life Hub Tech. All rights reserved.</p>
  </footer>

  <!-- Debugging + Markdown renderer + related posts -->
<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<script>
  (async () => {
    const params = new URLSearchParams(window.location.search);
    const file = params.get("file");
    const container = document.getElementById("article-content");

    // Helper: show visible debug line
    function debugLine(msg, isError = false) {
      const p = document.createElement("p");
      p.style.fontSize = "0.95em";
      p.style.color = isError ? "#b00020" : "#666";
      p.textContent = msg;
      container.appendChild(p);
    }

    if (!file) {
      container.innerHTML = "<p>❌ No article selected. Make sure the link includes ?file=FILENAME.md</p>";
      return;
    }

    try {
      // 1) Fetch the markdown article
      const articleResp = await fetch(`posts/${encodeURIComponent(file)}`);
      if (!articleResp.ok) {
        container.innerHTML = `<p style="color:#b00020;">⚠️ Could not fetch posts/${file} — HTTP ${articleResp.status}</p>`;
        console.error("Article fetch failed:", articleResp);
        return;
      }
      const markdown = await articleResp.text();

      // 2) Convert Markdown -> HTML
      let html = marked.parse(markdown);

      // 2b) Remove a leading H1 from html if present (avoid duplicate title)
      // If the markdown already includes "# Title" we keep that and ensure no other H1 shows.
      // But in case your template had injected an extra H1, remove it here:
      // (we remove any accidental first <h1> that is empty or duplicates the first heading)
      // extract first heading text from markdown
      const mdFirstLine = markdown.split("\n").find(l => l.trim().startsWith("#"));
      if (mdFirstLine) {
        // Normalise heading text
        const mdTitle = mdFirstLine.replace(/^#+\s*/, '').trim();
        // Remove any H1 already present at top of html that repeats this text
        // (replace only a top-level <h1> that equals mdTitle)
        html = html.replace(new RegExp('^\\s*<h1[^>]*>\\s*' + mdTitle.replace(/[-\/\\^$*+?.()|[\]{}]/g, '\\$&') + '\\s*</h1>'), '');
        // Also remove any duplicate H1 that may follow immediately
        html = html.replace(new RegExp('(</h1>\\s*){2,}'), '</h1>');
      }

      // Render the article
      container.innerHTML = html;

      // 3) Debug: show a small confirmation block (invisible in production later)
      const dbg = document.createElement("div");
      dbg.style.fontSize = "0.9em";
      dbg.style.color = "#666";
      dbg.style.marginTop = "12px";
      dbg.innerHTML = `<em>Loaded: <strong>${file}</strong></em>`;
      container.appendChild(dbg);

      // 4) Fetch posts.json to build related posts
      try {
        const postsResp = await fetch('posts.json', {cache: "no-cache"});
        if (!postsResp.ok) {
          // Show useful debug message
          container.appendChild(document.createElement("hr"));
          debugLine(`(Debug) Could not load posts.json — HTTP ${postsResp.status}`, true);
          return;
        }
        const posts = await postsResp.json();

        // Sanity check
        if (!Array.isArray(posts) || posts.length === 0) {
          container.appendChild(document.createElement("hr"));
          debugLine("(Debug) posts.json loaded but contains no entries.", false);
          return;
        }

        // Find related (exclude current file), pick up to 3
        const related = posts.filter(p => p.file !== file).sort(() => 0.5 - Math.random()).slice(0, 3);

        if (related.length === 0) {
          container.appendChild(document.createElement("hr"));
          debugLine("(Debug) No related posts (maybe posts.json has only this article).", false);
          return;
        }

        // Build related HTML and append
        const relatedDiv = document.createElement("div");
        relatedDiv.className = "related";
        let listHtml = `<h3>Related Articles</h3><ul style="list-style:none;padding:0;margin:8px 0;">`;
        for (const r of related) {
          const safeFile = encodeURIComponent(r.file);
          listHtml += `<li style="margin:8px 0;"><a href="post.html?file=${safeFile}" style="color:#133b6b;text-decoration:none;font-weight:bold;">${r.title}</a></li>`;
        }
        listHtml += `</ul>`;
        relatedDiv.innerHTML = listHtml;
        container.appendChild(document.createElement("hr"));
        container.appendChild(relatedDiv);
      } catch (e) {
        container.appendChild(document.createElement("hr"));
        debugLine("(Debug) Error while fetching or parsing posts.json. See console.", true);
        console.error("posts.json error:", e);
      }

    } catch (err) {
      container.innerHTML = `<p style="color:#b00020;">⚠️ Unexpected error loading article. See console for details.</p>`;
      console.error("Unexpected error:", err);
    }
  })();
</script>
